name: Flutter CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native platform runner projects
        run: sh tool/bootstrap_platforms.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization code
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
